<title id="t">Where the buyer’s $30.49 went</title>
<desc id="d">From one sandbox order: $12.50 India Post air shipping, $1.76 PayPal fee, $0.32 GST on the fee, $0.56 currency conversion, and Rs 1,441 to the cooperative, split by UPI as Rs 426 to Rafiq, Rs 373 to Shabana, Rs 267 to Imran, Rs 375 kept by the cooperative.</desc>
